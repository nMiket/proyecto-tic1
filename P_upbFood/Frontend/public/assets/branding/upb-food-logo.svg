<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-label="UPB Food">
  <defs>
    <linearGradient id="foodBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123e36" />
      <stop offset="100%" stop-color="#0f766e" />
