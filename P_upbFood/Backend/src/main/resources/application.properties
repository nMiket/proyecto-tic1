spring.application.name=Backend

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upbfood}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:upbfood}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:upbfood123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Useful defaults for API projects
spring.jpa.open-in-view=false

# Authentication
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:7}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}

# Correo de notificaciones de UPBFood
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Destinatario de las notificaciones
app.notificaciones.correo-destino=${APP_NOTIFICACIONES_CORREO_DESTINO:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# HU031: clave del encargado de la universidad para el panel /upb/solicitudes.
# Si se deja vacia, el panel institucional queda deshabilitado.
app.upb.revisor-clave=${APP_UPB_REVISOR_CLAVE:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

