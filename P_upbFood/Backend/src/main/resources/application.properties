spring.application.name=Backend

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upbfood}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:upbfood}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:upbfood123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Useful defaults for API projects
spring.jpa.open-in-view=false

# Authentication
app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-at-least-32-bytes-long}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:7}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
